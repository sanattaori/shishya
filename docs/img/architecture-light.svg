<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="100%" role="img" aria-label="The life of the model. Birth: it learns language from scratch on children's stories. Childhood: it learns to use a memory. Life: it reads and learns with no backprop. While it lives, text goes to a frozen neural network, a name and a meaning choose a place in the lasting memory, and the memory nudges the next letter. There is no LLM, stored text or search inside."><rect width="900" height="590" rx="10" fill="#fcfcfb"/><text x="24" y="36" fill="#0b0b0b" font-size="21" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">A neural network with a lasting memory</text><text x="24" y="60" fill="#52514e" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">No LLM inside. No stored text. No search.</text><rect x="24" y="92" width="268" height="132" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="38" y="118" fill="#0b0b0b" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">1. Birth</text><text x="38" y="142" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Starts with random weights.</text><text x="38" y="161" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Learns language from scratch on</text><text x="38" y="180" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">100M bytes of children&#x27;s stories.</text><text x="38" y="199" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Backprop. 6 hours on a free GPU.</text><rect x="316" y="92" width="268" height="132" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="330" y="118" fill="#0b0b0b" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">2. Childhood</text><text x="330" y="142" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Language is now frozen.</text><text x="330" y="161" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Learns how to use a memory,</text><text x="330" y="180" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">on made-up people and facts.</text><text x="330" y="199" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Backprop, for the last time.</text><rect x="608" y="92" width="268" height="132" rx="8" fill="#2a78d6" stroke="#e2e1dc"/><text x="622" y="118" fill="#ffffff" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">3. Life</text><text x="622" y="142" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Reads, and learns as it reads.</text><text x="622" y="161" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">No backprop, ever again.</text><text x="622" y="180" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Only the memory changes,</text><text x="622" y="199" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">by one simple local rule.</text><line x1="292" y1="158" x2="316" y2="158" stroke="#52514e" stroke-width="1.5"/><polygon points="316,158 308,162 308,154" fill="#52514e"/><line x1="584" y1="158" x2="608" y2="158" stroke="#52514e" stroke-width="1.5"/><polygon points="608,158 600,162 600,154" fill="#52514e"/><text x="24" y="272" fill="#0b0b0b" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">What happens in life</text><rect x="24" y="296" width="176" height="270" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="38" y="322" fill="#0b0b0b" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">1. It reads</text><text x="38" y="352" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">&quot;Priya lives in</text><text x="38" y="371" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">a town called</text><text x="38" y="390" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Nashik.&quot;</text><rect x="224" y="296" width="240" height="270" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="238" y="322" fill="#0b0b0b" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">2. Neurons fire</text><text x="238" y="480" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">The network knows language.</text><text x="238" y="499" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Frozen. It never changes.</text><text x="238" y="518" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Reading doesn&#x27;t touch it.</text><rect x="526" y="296" width="246" height="270" rx="8" fill="#2a78d6" stroke="#e2e1dc"/><text x="540" y="322" fill="#ffffff" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">3. Memory is written</text><text x="540" y="480" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">The rare name picks the rows.</text><text x="540" y="499" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">The meaning picks the spot.</text><text x="540" y="518" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">This is the learning.</text><rect x="792" y="296" width="84" height="270" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="806" y="322" fill="#0b0b0b" font-size="15" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Later</text><text x="806" y="352" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Priya ...</text><text x="806" y="371" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Nashik.</text><circle cx="248" cy="350" r="7" fill="#e2e1dc"/><circle cx="273" cy="350" r="7" fill="#e2e1dc"/><circle cx="298" cy="350" r="7" fill="#2a78d6"/><circle cx="323" cy="350" r="7" fill="#e2e1dc"/><circle cx="348" cy="350" r="7" fill="#e2e1dc"/><circle cx="373" cy="350" r="7" fill="#e2e1dc"/><circle cx="398" cy="350" r="7" fill="#e2e1dc"/><circle cx="423" cy="350" r="7" fill="#e2e1dc"/><circle cx="248" cy="369" r="7" fill="#e2e1dc"/><circle cx="273" cy="369" r="7" fill="#2a78d6"/><circle cx="298" cy="369" r="7" fill="#e2e1dc"/><circle cx="323" cy="369" r="7" fill="#e2e1dc"/><circle cx="348" cy="369" r="7" fill="#e2e1dc"/><circle cx="373" cy="369" r="7" fill="#2a78d6"/><circle cx="398" cy="369" r="7" fill="#e2e1dc"/><circle cx="423" cy="369" r="7" fill="#e2e1dc"/><circle cx="248" cy="388" r="7" fill="#e2e1dc"/><circle cx="273" cy="388" r="7" fill="#e2e1dc"/><circle cx="298" cy="388" r="7" fill="#e2e1dc"/><circle cx="323" cy="388" r="7" fill="#e2e1dc"/><circle cx="