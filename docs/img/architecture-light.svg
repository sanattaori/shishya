<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" role="img" aria-label="Architecture. Text goes to a frozen BDH reader and to the who part of the address. The reader gives the what part. Who and what address a lasting memory, the only part that changes. The memory nudges the next letter."><rect width="900" height="500" rx="10" fill="#fcfcfb"/><text x="24" y="34" fill="#0b0b0b" font-size="20" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Inside Shishya</text><text x="24" y="56" fill="#52514e" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Only the blue part changes after training.</text><rect x="24" y="92" width="220" height="76" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="38" y="116" fill="#0b0b0b" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">The text</text><text x="38" y="138" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Priya lives in a town called</text><rect x="300" y="76" width="340" height="164" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="314" y="100" fill="#0b0b0b" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Reader: BDH  (100.9M, frozen)</text><text x="314" y="122" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">1  Neurons fire</text><text x="314" y="141" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">2  They link to earlier bytes</text><text x="314" y="160" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">3  Neurons fire again</text><text x="314" y="179" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">4  A neuron stays on only if both agree</text><text x="314" y="198" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">5  Update, then repeat: 6 rounds</text><rect x="696" y="92" width="180" height="76" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="710" y="116" fill="#0b0b0b" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Next letter</text><text x="710" y="138" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">N</text><text x="710" y="157" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">guess + nudge</text><rect x="24" y="288" width="220" height="92" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="38" y="312" fill="#0b0b0b" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Who  (frozen)</text><text x="38" y="334" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">The rare name picks</text><text x="38" y="353" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">40 of 16,384 rows</text><rect x="300" y="288" width="220" height="92" rx="8" fill="#f3f2ef" stroke="#e2e1dc"/><text x="314" y="312" fill="#0b0b0b" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">What  (frozen)</text><text x="314" y="334" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">What kind of fact this is:</text><text x="314" y="353" fill="#52514e" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">32 numbers</text><rect x="580" y="288" width="296" height="180" rx="8" fill="#2a78d6" stroke="#e2e1dc"/><text x="594" y="312" fill="#ffffff" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">Lasting memory</text><text x="594" y="334" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">16,384 × 32 × 128 numbers</text><text x="594" y="353" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">The only part that changes</text><text x="594" y="372" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"></text><text x="594" y="391" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">To learn, it writes the next letter:</text><text x="594" y="410" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">M += β · who · what ⊗ error</text><text x="594" y="429" fill="#ffffff" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">No gradients. No stored text.</text><path d="M244,130 L300,130" fill="none" stroke="#52514e" stroke-width="1.5"/><polygon points="300,130 292,134 292,126" fill="#52514e"/><path d="M640,130 L696,130" fill="none" stroke="#52514e" stroke-width="1.5"/><polygon points="696,130 688,134 688,126" fill="#52514e"/><path d="M134,168 L134,288" fill="none" stroke="#52514e" stroke-width="1.5"/><polygon points="134,288 138,280 130,280" fill="#52514e"/><path d="M410,240 L410,288" fill="none" stroke="#52514e" stroke-width="1.5"/><polygon points="410,288 414,280 406,280" fill="#52514e"/><text x="418" y="268" fill="#52514e" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">reader&#x27;s state</text><path d="M520,334 L580,334" fill="none" stroke="#52514e" stroke-width="1.5"/><polygon points="580,334 572,338 572,330" fill="#52514e"/><path d="M134,380 L134,432 L580,432" fill="none" stroke="#52514e" stroke-width="1.5"/><polygon points="580,432 572,436 572,428" fill="#52514e"/><text x="300" y="424" fill="#52514e" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">picks the row</text><path d="M786,288 L786,168" fill="none" stroke="#52514e" stroke-width="1.5"/><polygon points="786,168 782,176 790,176" fill="#52514e"/><text x="794" y="232" fill="#52514e" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve">nudges</text></svg>