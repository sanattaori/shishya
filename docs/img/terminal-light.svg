<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312" role="img" aria-label="Terminal: drafting a rule from English, then a decision that the rule corrected"><rect width="860" height="312" rx="10" fill="#16161a"/><circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="38" cy="18" r="5.5" fill="#febc2e"/><circle cx="56" cy="18" r="5.5" fill="#28c840"/><text x="18" y="52" fill="#7ab7ff" font-size="13" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">$ </text><text x="34" y="52" fill="#e8e6e1" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">shishya rules schema.json &quot;Never buy while the market guard is on.&quot; --guru claude</text><text x="18" y="73" fill="#ff8a7a" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  BLOCK  {&quot;action&quot;: &quot;add&quot;,  ...}  &lt;- no_add_when_market_guard_on</text><text x="18" y="94" fill="#7ed98b" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  allow  {&quot;action&quot;: &quot;hold&quot;, ...}</text><text x="18" y="115" fill="#9a9890" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">Review these rules, then add them to the schema. Nothing was applied.</text><text x="18" y="136" fill="#9a9890" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"></text><text x="18" y="157" fill="#7ab7ff" font-size="13" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">$ </text><text x="34" y="157" fill="#e8e6e1" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">shishya decide schema.json --input &quot;ACMEIND: Quarterly profit up 64%&quot; \</text><text x="18" y="178" fill="#e8e6e1" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">      --route news_impact=shishya:news-base --backend http://127.0.0.1:8009</text><text x="18" y="199" fill="#e8e6e1" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">status: ok</text><text x="18" y="220" fill="#e8e6e1" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">answer: {&quot;news_impact&quot;: &quot;bullish&quot;, &quot;action&quot;: &quot;hold&quot;, &quot;tell_owner&quot;: true}</text><text x="18" y="241" fill="#9a9890" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">model&#x27;s top answer: {&quot;news_impact&quot;: &quot;bullish&quot;, &quot;action&quot;: &quot;add&quot;, ...}</text><text x="18" y="262" fill="#ff8a7a" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">broken rule: no_buying_when_market_weak (rejected 1)</text><text x="18" y="283" fill="#9a9890" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">timings: model_ms 251, search_ms 0</text></svg>