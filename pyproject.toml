[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shishya"
version = "0.3.0"
description = "Research on a neural network that keeps learning after training, plus a library for rule-following decisions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Sanat Taori" }]
keywords = ["continual-learning", "hebbian", "bdh", "memory", "research", "llm", "decision-model", "rules", "opa", "rego"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
local = ["torch>=2.4", "transformers>=4.48", "safetensors>=0.4"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
shishya = "shishya.cli:main"

[project.urls]
Homepage = "https://github.com/sanattaori/shishya"
Issues = "https://github.com/sanattaori/shishya/issues"

[tool.hatch.build.targets.wheel]
packages = ["shishya"]

[tool.hatch.build.targets.sdist]
include = ["shishya", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["brain/third_party", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["E402"]
"train/*" = ["E402", "E501", "I001", "E731"]
"lab/*" = ["E", "I001", "B", "F", "UP"]
"mind/*" = ["E", "I001", "B", "F", "UP"]
"brain/poc_*" = ["E", "I001", "B", "F", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
